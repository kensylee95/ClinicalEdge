[package]
name = "Structra"
version = "1.0.0"
description = "Structra — Unstructured input. Structured records. Zero cloud."
authors = []
edition = "2021"

[lib]
name = "clinical_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
num_cpus = "1"
symphonia = { version = "0.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"
once_cell = "1"
rubato = "0.15"
whisper-rs = "0.16.0"
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql   = { version = "2", features = ["sqlite"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sysinfo            = "0.30"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
ndarray = "0.17.2"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "tiff", "webp"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
imageproc = "0.27.0"
rstar = "0.12"
petgraph = "0.6"
geo = "0.24.1"
geo-buffer = "0.2.0"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
