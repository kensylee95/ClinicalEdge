[package]
name = "clinical-edge"
version = "1.0.0"
description = "ClinicalEdge — Sovereign Medical Intake Node"
authors = []
edition = "2021"

[lib]
name = "clinical_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"
once_cell = "1"
rubato = "0.15"
whisper-rs = "0.16.0"
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql   = { version = "2", features = ["sqlite"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sysinfo            = "0.30"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
